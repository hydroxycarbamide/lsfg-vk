name: Build lsfg-vk on Flatpak
on: [push]

jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: true
    - name: Apply library path fix
      run: |
        sed -i 's|"library_path": "../../../lib/liblsfg-vk.so"|"library_path": "/usr/lib/extensions/vulkan/lsfgvk/lib/liblsfg-vk.so"|g' VkLayer_LS_frame_generation.json
    - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
      with:
        bundle: org.freedesktop.Platform.VulkanLayer.lsfgvk.flatpak
        manifest-path: org.freedesktop.Platform.VulkanLayer.lsfgvk.yml
