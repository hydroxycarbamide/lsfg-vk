name: Build lsfg-vk Flatpak

on:
  workflow_dispatch:

jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
    - uses: actions/checkout@v4

    - name: Install flatpak deps
      run: |
        flatpak install -y org.freedesktop.Sdk.Extension.llvm20

    - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
      with:
        bundle: org.freedesktop.Platform.VulkanLayer.lsfgvk.flatpak
        manifest-path: org.freedesktop.Platform.VulkanLayer.lsfgvk.yml
        cache-key: flatpak-builder-${{ github.sha }}
