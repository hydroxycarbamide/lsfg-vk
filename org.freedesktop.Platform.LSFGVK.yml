id: org.freedesktop.Platform.VulkanLayer.lsfgvk
branch: '23.08'
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
build-extension: true
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm18

build-options:
  prefix: /usr/lib/extensions/vulkan/lsfgvk
  prepend-path: /usr/lib/extensions/vulkan/lsfgvk/bin
  prepend-pkg-config-path: /usr/lib/extensions/vulkan/lsfgvk/share/pkgconfig
  env:
    PYTHONPATH: /usr/lib/extensions/vulkan/lsfgvk/lib/python3.9/site-packages
    C_INCLUDE_PATH: /usr/lib/extensions/vulkan/lsfgvk/include
    CPLUS_INCLUDE_PATH: /usr/lib/extensions/vulkan/lsfgvk/include
  strip: true

x-arch-build-options:
  x86_64: &x86_64-build-options
    libdir: /usr/lib/extensions/vulkan/lsfgvk/lib/x86_64-linux-gnu
    prepend-pkg-config-path: /usr/lib/extensions/vulkan/lsfgvk/lib/x86_64-linux-gnu/pkgconfig
    ldflags: -Wl,-rpath=/usr/lib/extensions/vulkan/lsfgvk/lib/x86_64-linux-gnu
    env:
      FLATPAK_LIBDIR: /usr/lib/extensions/vulkan/lsfgvk/lib/x86_64-linux-gnu
  i386: &i386-build-options
    libdir: /usr/lib/extensions/vulkan/lsfgvk/lib/i386-linux-gnu
    prepend-pkg-config-path: /usr/lib/extensions/vulkan/lsfgvk/lib/i386-linux-gnu/pkgconfig:/usr/lib/i386-linux-gnu/pkgconfig
    ldflags: -Wl,-rpath=/usr/lib/extensions/vulkan/lsfgvk/lib/i386-linux-gnu
    append-path: /usr/lib/sdk/toolchain-i386/bin
    env:
      FLATPAK_LIBDIR: /usr/lib/extensions/vulkan/lsfgvk/lib/i386-linux-gnu
      CC: ccache i686-unknown-linux-gnu-gcc
      CXX: ccache i686-unknown-linux-gnu-g++

modules:
  # SDL2 dependency (same as app, for example)
  - name: SDL2
    buildsystem: cmake
    builddir: true
    build-options:
      append-path: /usr/lib/sdk/llvm18/bin
      env:
        CC: clang
        CXX: clang++
    config-opts:
      - -DCMAKE_INSTALL_PREFIX=/usr/lib/extensions/vulkan/lsfgvk
      - -DSDL_STATIC=OFF
      - -DSDL_SHARED=ON
      - -DSDL_TEST=OFF
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL/archive/refs/tags/release-2.30.3.tar.gz
        sha256: ba67e012a3b0cfba2987f486ebbff13a517905e32bae627f07a327edb10dfd85

  # Vulkan-Headers, installed to extension include
  - name: vulkan-headers
    buildsystem: cmake
    builddir: false
    build-options:
      append-path: /usr/lib/sdk/llvm18/bin
      env:
        CC: clang
        CXX: clang++
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/usr/lib/extensions/vulkan/lsfgvk
      - -DCMAKE_SKIP_INSTALL_RPATH=ON
    sources:
      - type: git
        url: https://github.com/KhronosGroup/Vulkan-Headers.git
        tag: vulkan-sdk-1.4.313.0
    build-commands:
      - cmake ${CMAKE_ARGS}
      - cmake --build .
      - cmake --install .
    post-install:
      - python3 -m compileall -d /usr/lib/extensions/vulkan/lsfgvk /usr/lib/extensions/vulkan/lsfgvk || true
      - python3 -O -m compileall -d /usr/lib/extensions/vulkan/lsfgvk /usr/lib/extensions/vulkan/lsfgvk || true

  # Spirv-Headers
  - name: spirv-headers
    buildsystem: cmake
    builddir: false
    build-options:
      append-path: /usr/lib/sdk/llvm18/bin
      env:
        CC: clang
        CXX: clang++
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/usr/lib/extensions/vulkan/lsfgvk
      - -DCMAKE_SKIP_INSTALL_RPATH=ON
    sources:
      - type: git
        url: https://github.com/KhronosGroup/Spirv-Headers.git
        tag: vulkan-sdk-1.4.313.0
    build-commands:
      - cmake ${CMAKE_ARGS}
      - cmake --build .
      - cmake --install .
    #post-install:
      #- install -Dm644 LICENSE /usr/share/licenses/spirv-headers/LICENSE

  # Vulkan-Loader (IMPORTANT: Set CFLAGS/CXXFLAGS to use vulkan-headers in extension)
  - name: vulkan-loader
    buildsystem: cmake
    builddir: false
    build-options:
      append-path: /usr/lib/sdk/llvm18/bin
      env:
        CC: clang
        CXX: clang++
        CFLAGS: "-I/usr/lib/extensions/vulkan/lsfgvk/include"
        CXXFLAGS: "-I/usr/lib/extensions/vulkan/lsfgvk/include"
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/usr/lib/extensions/vulkan/lsfgvk
      - -DCMAKE_SKIP_INSTALL_RPATH=ON
    sources:
      - type: git
        url: https://github.com/KhronosGroup/Vulkan-Loader.git
        tag: vulkan-sdk-1.4.313.0
    build-commands:
      - cmake ${CMAKE_ARGS}
      - cmake --build .
      - cmake --install .
    #post-install:
      #- install -Dm644 LICENSE.txt /usr/share/licenses/vulkan-loader/LICENSE.txt

  # lsfg-vk (your Vulkan layer itself)
  - name: lsfg-vk
    buildsystem: cmake
    build-options:
      append-path: /usr/lib/sdk/llvm18/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm18/lib
      env:
        CC: clang
        CXX: clang++
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=${FLATPAK_DEST}
      - -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON
      - -DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,lazy
    sources:
      - type: git
        url: https://github.com/PancakeTAS/lsfg-vk.git
        branch: develop
    build-commands:
      - cmake -B build -G Ninja -DCMAKE_INSTALL_PREFIX=${FLATPAK_DEST} -DCMAKE_BUILD_TYPE=Release -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON -DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,lazy
      - ninja -C build
      - ninja -C build install
    # post-install:
    #   - install -Dm644 VkLayer_LS_frame_generation.json ${FLATPAK_DEST}/share/vulkan/implicit_layer.d/VkLayer_LS_frame_generation.json
    #   - install -Dm644 build/liblsfg-vk.so ${FLATPAK_DEST}/lib/liblsfg-vk.so
      #- install -Dm644 LICENSE.md /usr/share/licenses/lsfg-vk/LICENSE
