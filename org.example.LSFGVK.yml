app-id: org.example.LSFGVK
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm20
command: lsfg-vk-wrapper
finish-args:
  - --share=network
  - --device=dri
  - --filesystem=home
  - --socket=wayland
  - --socket=x11

modules:
  # SDL2 with Clang
  - name: SDL2
    buildsystem: cmake
    builddir: true
    build-options:
      append-path: /usr/lib/sdk/llvm20/bin
      env:
        CC: clang
        CXX: clang++
    config-opts:
      - -DCMAKE_INSTALL_PREFIX=/app
      - -DSDL_STATIC=OFF
      - -DSDL_SHARED=ON
      - -DSDL_TEST=OFF
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL/archive/refs/tags/release-2.30.3.tar.gz
        sha256: ba67e012a3b0cfba2987f486ebbff13a517905e32bae627f07a327edb10dfd85

  # Vulkan-Headers with patch applied directly
  - name: vulkan-headers
    buildsystem: cmake
    builddir: true
    build-options:
      append-path: /usr/lib/sdk/llvm20/bin
      env:
        CC: clang
        CXX: clang++
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app
      - -DCMAKE_SKIP_INSTALL_RPATH=ON
    sources:
      - type: git
        url: https://github.com/KhronosGroup/Vulkan-Headers.git
        tag: vulkan-sdk-1.4.313.0
      - type: file
        url: https://gitlab.archlinux.org/archlinux/packaging/packages/vulkan-headers/-/raw/main/0001-Remove-Werror.patch?inline=false
        sha256: 0818df922c751156b1db78e06eb29f772d196b45e8b341d8a31daa558c690ce0
    build-commands:
      - patch -p1 -i 0001-Remove-Werror.patch || true
      - cmake -B build ${CMAKE_ARGS}
      - cmake --build build
      - cmake --install build
    post-install:
      - python3 -m compileall -d /app /app || true
      - python3 -O -m compileall -d /app /app || true

  # LSFG-VK main project
  - name: lsfg-vk
    buildsystem: cmake
    build-options:
      append-path: /usr/lib/sdk/llvm20/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm20/lib
      env:
        CC: clang
        CXX: clang++
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app
      - -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON
      - -DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,lazy
    sources:
      - type: git
        url: https://github.com/PancakeTAS/lsfg-vk.git
        branch: develop
    build-commands:
      - cmake -B build -G Ninja ${CMAKE_ARGS}
      - ninja -C build
      - ninja -C build install
    post-install:
      - install -Dm644 VkLayer_LS_frame_generation.json /app/etc/vulkan/implicit_layer.d/VkLayer_LS_frame_generation.json
      - install -Dm644 build/liblsfg-vk.so /app/lib/liblsfg-vk.so
      - install -Dm644 LICENSE.md /app/share/licenses/lsfg-vk/LICENSE

  # Vulkan ICD loader
  - name: vulkan-icd-loader
    buildsystem: meson
    config-opts:
      - --prefix=/app
    sources:
      - type: archive
        url: https://github.com/KhronosGroup/Vulkan-Loader/archive/refs/tags/v1.3.261.tar.gz
        sha256: 85d13004c81b032baf7cc4c2de0b2cb57072a86855d7ca7fc9a813621da275ba
