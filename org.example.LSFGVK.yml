app-id: org.example.LSFGVK
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm20
command: lsfg-vk-wrapper
finish-args:
  - --share=network
  - --device=dri
  - --filesystem=home
  - --socket=wayland
  - --socket=x11

modules:
  # SDL2 with Clang
  - name: SDL2
    buildsystem: cmake
    builddir: true
    build-options:
      append-path: /usr/lib/sdk/llvm20/bin
      env:
        CC: clang
        CXX: clang++
    config-opts:
      - -DCMAKE_INSTALL_PREFIX=/app
      - -DSDL_STATIC=OFF
      - -DSDL_SHARED=ON
      - -DSDL_TEST=OFF
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL/archive/refs/tags/release-2.30.3.tar.gz
        sha256: ba67e012a3b0cfba2987f486ebbff13a517905e32bae627f07a327edb10dfd85

  # Vulkan-Headers without patch, in-source build
  - name: vulkan-headers
    buildsystem: cmake
    builddir: false
    build-options:
      append-path: /usr/lib/sdk/llvm20/bin
      env:
        CC: clang
        CXX: clang++
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app
      - -DCMAKE_SKIP_INSTALL_RPATH=ON
    sources:
      - type: git
        url: https://github.com/KhronosGroup/Vulkan-Headers.git
        tag: vulkan-sdk-1.4.313.0
    build-commands:
      - cmake ${CMAKE_ARGS}
      - cmake --build .
      - cmake --install .
    post-install:
      - python3 -m compileall -d /app /app || true
      - python3 -O -m compileall -d /app /app || true

  # SPIRV-Headers
  - name: spirv-headers
    buildsystem: cmake
    builddir: true
    build-options:
      append-path: /usr/lib/sdk/llvm20/bin
      env:
        CC: clang
        CXX: clang++
    config-opts:
      - -DCMAKE_INSTALL_PREFIX=/app
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE
